name: Hospital Management System CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Dilkhush@30
          MYSQL_DATABASE: hospital_management_system
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pDilkhush@30 hospital_management_system < database.sql

      - name: Compile Java Application
        run: |
          mkdir -p bin
          cp -r src/icon bin/icon || true
          javac -cp ".:mysql-connector-java-8.0.28.jar:ResultSet2xml.jar" -d bin src/hospital/management/system/*.java

      - name: Run Headless Verification Test
        run: |
          cat << 'EOF' > TestDB.java
          import hospital.management.system.conn;

          public class TestDB {
              public static void main(String[] args) {
                  System.out.println("Testing DB Connection from GitHub Actions...");
                  try {
                      conn c = new conn();
                      if (c.statement != null) {
                          System.out.println("SUCCESS: Database connected successfully in GitHub Actions!");
                          System.exit(0);
                      } else {
                          System.err.println("FAILED: Database statement is null!");
                          System.exit(1);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                      System.exit(1);
                  }
              }
          }
          EOF
          javac -cp ".:bin:mysql-connector-java-8.0.28.jar" TestDB.java
          java -Djava.awt.headless=true -cp ".:bin:mysql-connector-java-8.0.28.jar:ResultSet2xml.jar" TestDB
